name: CI - Doc Index & Syntax Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate JSON Index & Core Markdown Files
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate doc-index.json Format
        run: |
          python -c "
          import json
          from pathlib import Path
          with open('doc-index.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          files = data['files']
          assert data['total_pages'] == len(files), 'Index page count does not match file list'
          missing = [path for path in files if not Path(path).is_file()]
          assert not missing, f'Indexed document files are missing: {missing[:10]}'
          print(f'Successfully validated doc-index.json with {len(files)} document entries.')
          "

      - name: Check Documentation Entry Files
        run: |
          test -s README.md && echo "README.md present"
          test -s llms.txt && echo "llms.txt present"
          test -s llms-full.txt && echo "llms-full.txt present"
          test -s doc-index.json && echo "doc-index.json present"
