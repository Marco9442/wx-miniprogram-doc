name: CI - Doc Index & Syntax Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate JSON Index & Core Markdown Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate doc-index.json Format
        run: |
          python -c "
          import json
          with open('doc-index.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          count = len(data['files'])
          print(f'Successfully validated doc-index.json with {count} document entries.')
          "

      - name: Check Core Agent Files Existence
        run: |
          missing=0
          for file in AGENTS.md llms.txt llms-full.txt INDEX.md; do
            if test -f "$file"; then
              echo "$file present"
            else
              echo "::error file=$file::Required core file is missing: $file"
              missing=1
            fi
          done
          exit "$missing"
