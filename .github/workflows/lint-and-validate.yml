name: CI - Doc Index & Syntax Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate JSON Index & Core Markdown Files
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate doc-index.json Format
        run: |
          python -c "
          import json
          with open('doc-index.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          print(f'Successfully validated doc-index.json with {len(data)} document entries.')
          "

      - name: Check Core Agent Files Existence
        run: |
          test -f AGENTS.md && echo "AGENTS.md present"
          test -f llms.txt && echo "llms.txt present"
          test -f llms-full.txt && echo "llms-full.txt present"
          test -f INDEX.md && echo "INDEX.md present"
